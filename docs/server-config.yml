## Ability trigger prefixes
prefix-left-click: "&f\uE000 &7"  # Used for items
prefix-right-click: "&f\uE001 &7"  # Used for food and drinks

## Default prototype kit configuration
prototype-kit:
    material: "rabbit_foot"
    model-data: 129
    name: "&cPrototype Kit"
    lore:
        - "&7Value: &c2500 Dragon Coins"
        - "&7Use this kit to create a custom item"
        - "&f\uE000&7 Begin crafting an item"

## Available abilities that can be applied to items and food
## command-console is run on the console and replaces:
## [playerName] with the name of the user
abilities:
    #Effect Spells
    prototype-effectSpell-splash:
        name: "Splash Attack"
        description: "Splashes water all around you"
        icon-material: "jigsaw"
        icon-custom-model-data: 1572
        command-console: "cast forcecast [playerName] prototype-effectSpell-splash"
        actions:
          - type: burst
            particle: rain
            counts: [100, 100, 100]
            spreads: [0.2, 0.5, 1.0]
            spreads-y: [0.2, 0.5, 1.0]
            heights: [1.0, 1.5, 2.0]
            speed: 0.1
            sound: minecraft:entity.generic.splash
            volume: 1
            pitch: 1
        charges: 100
        stack-size: 25
        cooldown: 5000  # Default 5s cooldown
        allowed-types: ["ITEM"]  
        
    prototype-effectSpell-splash2:
        name: "Splash Attack"
        description: "Splashes water all around you"
