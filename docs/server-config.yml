        charges: 1
        stack-size: 99
        cooldown: 500  # Default 5s cooldown
        allowed-types: ["FOOD", "DRINK"] 
        
    prototype-effectSpell-selfDestruct:
        name: "Self Destructs"
        description: "Self destructs and causes you to fall down"
        icon-material: "jigsaw"
        icon-custom-model-data: 1568
        command-console: "cast forcecast [playerName] prototype-effectSpell-selfDestruct"
        actions:
          - type: burst
            particle: entity_effect
            counts: [5, 5, 5]
            spreads: [0.2, 0.5, 1.0]
            spreads-y: [0.2, 0.5, 1.0]
