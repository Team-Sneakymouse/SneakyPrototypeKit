## Ability trigger prefixes
prefix-left-click: "&e[Left Click] &7"  # Used for items
prefix-right-click: "&e[Right Click] &7"  # Used for food and drinks

## Default prototype kit configuration
prototype-kit:
    material: "rabbit_foot"
    model-data: 129
    name: "&cPrototype Kit"
    lore:
        - "&7Value: &c2500 Dragon Coins"
        - "&7Use this kit to create a custom item"
        - "&eL-Click: &7Begin crafting an item"

## Available abilities that can be applied to items and food
## An ability runs either native `actions:` (preferred) or a legacy `command-console`
## (run on the console; [playerName] = the user).
## Action types: particles, burst, ring, sound, title-animation, message, command, player-command,
## leap, forcepush, toss, levitate, blink, magnet, flight, potion, heal, ignite, freeze,
## invulnerable, age, jump-buff, enderchest, beam, projectile, chain, area, arrow-rain,
## conjure, summon, wall, entomb. Every action also takes delay, repeat, interval and chance.
## See docs/actions.md and docs/server-config.yml (the dev server's ported abilities).
abilities:
    heal:
        name: "Healing Touch"
        description: "Heals the user"
        icon-material: "jigsaw"
        icon-custom-model-data: 1
        actions:
          - type: heal
            amount: 8
          - type: particles
            particle: heart
            count: 5
            spread: 0.4
            height: 2
        charges: 10
        stack-size: 5
        cooldown: 5000  # 5 second cooldown
        allowed-types: ["FOOD", "DRINK"]  # Both food and drinks can heal
    lightning:
        name: "Lightning Strike"
        description: "Strikes lightning at the user"
        icon-material: "jigsaw"
        icon-custom-model-data: 2
        actions:
          - type: sound
            sound: entity.lightning_bolt.thunder
            volume: 0.6
            pitch: 1.4
          - type: beam
            max-distance: 25
            can-target: [players, mobs]
            trail:
              - type: particles
                particle: electric_spark
                count: 4
                spread: 0.05
            on-hit:
              - type: potion
                effect: slowness
                duration: 60
                amplifier: 2
              - type: particles
                particle: flash
                color: "BFE6FF"
                count: 1
        charges: 5
        stack-size: 3
        cooldown: 2000  # 2 second cooldown
        allowed-types: ["ITEM"]  # Only items can strike lightning
    speed_boost:
        name: "Speed Boost"
        description: "Gives a temporary speed boost when used"
        icon-material: "jigsaw"
        icon-custom-model-data: 3
        actions:
          - type: potion
            effect: speed
            duration: 600
            amplifier: 1
          - type: burst
            particle: cloud
            counts: [10, 15, 20]
            sound: entity.breeze.wind_burst
        charges: 25
        stack-size: 2
        cooldown: 500  # Default 500ms cooldown
        allowed-types: ["ITEM", "FOOD", "DRINK"]  # All types can give speed

